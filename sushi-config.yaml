id: fhir.nwgenomics.nhs.uk
canonical: https://fhir.nwgenomics.nhs.uk
version: 2.1.8
name: NWGMSA
title: NHS North West Genomics
description: NHS North West Genomic Medicine Service Alliance - IHE Laboratory Testing Workflow (LTW)
releaseLabel: ci-build

status: draft
publisher:
  ## Find your domain contact on the https://www.ihe.net/ihe_domains page
  - name: NHS North West Genomics
  - url: https://www.nwgenomics.nhs.uk/contact-us

license:  CC-BY-4.0
fhirVersion: 4.0.1
jurisdiction: urn:iso:std:iso:3166#GB "United Kingdom of Great Britain and Northern Ireland"

#copyright: IHE http://www.ihe.net/Governance/#Intellectual_Property
copyrightYear: 2024+

dependencies:
  hl7.fhir.eu.base: 2.0.0
  fhir.r4.ukcore.stu3.currentbuild:
    version: 0.29.0-pre-release
#    uri: https://simplifier.net/guide/ukcoreversionhistory
  hl7.fhir.uv.genomics-reporting: 3.0.0
  hl7.fhir.eu.laboratory: 2.0.0
  hl7.fhir.uv.sdc: 4.0.0
  hl7.fhir.extensions.r5: 4.0.1
##  hl7.fhir.uv.xver-r5.r4: 0.0.1-snapshot-2
  ihe.iti.balp: 1.1.4

FSHOnly: false
# see https://confluence.hl7.org/display/FHIR/Implementation+Guide+Parameters
parameters:
  path-binary: input/attachments
  path-resource:
    - input/resources
    - fsh-generated/resources
    - input/examples
  show-inherited-invariants: 'false'
  usage-stats-opt-out: 'false'
  logging: progress
  shownav: true
  active-tables: 'false'
  apply-contact: 'true'
  apply-jurisdiction: 'true'
  apply-publisher: 'true'
  apply-version: 'true'
  excludexml: 'false'
  excludettl: 'true'
  excludemap: 'true'
  generate:
    - xml
    - json
  path-expansion-params: '../resources/Parameters-exp-params.json'
  special-url:
    - https://fhir.nhs.uk/CodeSystem/England-GenomicTestDirectory
    - http://hl7.org/fhir/uv/genomics-reporting/CodeSystem/tbd-codes-cs
  pin-canonicals: pin-multiples
 # pin-external: true

#resources:
# list every example here with a name, description and that exampleBoolean is true; These are used to populate the artifacts page, and are needed to eliminate build warnings 
# You may delay filling out this section until you approach publication as it is merely a nice to have and eliminates build warnings -- If you do this then you will need above the autoload-resources true
instanceOptions:
  setMetaProfile: standalone-only


